# EVREN Agent Configuration
agent:
  name: "EvrenAgent"
  system_prompt: >
    You are EvrenAgent, an autonomous, extensible AI assistant equipped with dynamic
    Model Context Protocol (MCP) servers, modular Skills, and lifecycle Plugins.
    You can inspect your tools, call external servers, add new skills, install plugins,
    and switch model providers seamlessly. Always be helpful, precise, and thoughtful.
  default_provider: "evren"
  max_iterations: 15
  temperature: 0.7
  stream: true

# Supported Providers
providers:
  evren:
    type: "evren"
    base_url: "https://evren-llmapi.ssyz.org.tr/v1"
    api_key_env: "EVREN_API_KEY"
    default_model: "glm-5.3"
    models:
      - id: "glm-5.3"
        name: "GLM 5.3"
        context_window: 512000
        supports_tools: true
      - id: "deepseek-v4-flash"
        name: "DeepSeek V4 Flash"
        context_window: 1000000
        supports_tools: true
      - id: "qwen3.8-flash-next"
        name: "Qwen 3.8 Flash Next"
        context_window: 256000
        supports_tools: true
      - id: "gemma-4-31b"
        name: "Gemma 4 31B"
        context_window: 256000
        supports_tools: true
      - id: "qwen3-vl-30b"
        name: "Qwen 3 VL 30B (Vision)"
        context_window: 256000
        supports_tools: true
      - id: "auto"
        name: "Auto Smart Routing"
        supports_tools: true

  llmtr:
    type: "evren_gateway"
    base_url: "https://llmtr.com/v1"
    api_key_env: "LLMTR_API_KEY"
    default_model: "evren/glm-5.3-fp8"
    models:
      - id: "evren/glm-5.3-fp8"
        name: "Evren GLM 5.3 FP8 (via LLMTR)"
        context_window: 512000
      - id: "evren/deepseek-v4-flash-tr"
        name: "Evren DeepSeek V4 Flash TR (via LLMTR)"
        context_window: 1000000
      - id: "evren/gemma-4-31b"
        name: "Evren Gemma 4 31B (via LLMTR)"
        context_window: 256000
      - id: "evren/qwen3.8-flash-next"
        name: "Evren Qwen 3.8 Flash Next (via LLMTR)"
        context_window: 256000
      - id: "evren/qwen3-vl-30b"
        name: "Evren Qwen 3 VL 30B (via LLMTR)"
        context_window: 256000

  openai:
    type: "openai"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o"

# MCP Servers (Model Context Protocol)
mcp_servers: {}

# Skills Settings
skills:
  directory: "skills"
  autoload_builtins: true
  active_skills:
    - "code_assistant"
    - "computer-use"

# Plugins Settings
plugins:
  directory: "plugins"
  autoload_builtins: true
  enabled_plugins:
    - "logger"
    - "calculator"
