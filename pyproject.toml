[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-agent"
version = "0.2.0"
description = "EVREN public API CLI and Python client, with optional MCP/Skills/Plugins agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
evren-agent = "evren_agent.cli:main"
evren = "evren_agent.api.cli:main"

[tool.setuptools.package-data]
"evren_agent.api" = ["openapi.json"]
"evren_agent" = ["builtin_skills/*/*.md", "builtin_skills/*/*.yaml"]

[tool.setuptools.packages.find]
include = ["evren_agent*"]
