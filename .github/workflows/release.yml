name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag (for example v0.2.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64, arch: arm64}
          - {os: macos-15-intel, platform: macos-x64, arch: x64}
          - {os: windows-2022, platform: windows-x64, arch: x64}
          - {os: ubuntu-22.04, platform: linux-x86_64, arch: x64}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 libsecret-1-dev xvfb xauth rpm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'pyinstaller>=6.16,<7'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python scripts/validate_release.py
      - name: Test on Linux with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        run: python -m pytest
      - name: Build desktop application
        run: python -m PyInstaller evren.spec --clean --noconfirm
      - name: Smoke test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_desktop.py
      - name: Smoke test packaged application on macOS and Windows
        if: runner.os != 'Linux'
        run: python scripts/smoke_desktop.py
      - name: Create native installers
        run: python scripts/package_desktop.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release_assets/*
          if-no-files-found: error

  build-python:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: [build-desktop, build-python]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Verify all installers and generate SHA256 checksums
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python scripts/validate_release.py --assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: evren ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: packaging/release-notes.md
          files: release_assets/*
