name: Dağıtım ve Sürüm Yayınlama (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Sürüm Etiketi (Örn: v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  # 1. Çapraz Platform Masaüstü İkili Paketleri (macOS, Windows, Linux)
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon arm64)
            os: macos-latest
            arch: arm64
            artifact_name: evren-macos-arm64.zip
          - name: macOS (Intel x86_64)
            os: macos-13
            arch: x64
            artifact_name: evren-macos-x64.zip
          - name: Windows (x64)
            os: windows-latest
            arch: x64
            artifact_name: evren-windows-x64.zip
          - name: Linux (x86_64)
            os: ubuntu-latest
            arch: x86_64
            artifact_name: evren-linux-x86_64.tar.gz

    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Linux bağımlılıkları (Tkinter, SecretService vb.)
      - name: Linux Sistem Kütüphanelerini Kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 libsecret-1-dev libglib2.0-dev

      - name: Python Bağımlılıklarını Kur
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pyinstaller

      - name: Birim Testleri Çalıştır
        run: |
          pytest

      - name: PyInstaller ile 'evren' Uygulamasını Derle
        run: |
          pyinstaller evren.spec --clean --noconfirm

      # macOS Paketleme (evren.app -> .zip)
      - name: macOS için Paketle (.zip)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y ../${{ matrix.artifact_name }} evren.app
          cd ..

      # Windows Paketleme (evren.exe -> .zip)
      - name: Windows için Paketle (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\evren.exe, evren.bat -DestinationPath ${{ matrix.artifact_name }}

      # Linux Paketleme (evren, desktop kısayolu ve icon -> .tar.gz ve .deb)
      - name: Linux için Paketle (.tar.gz ve .deb)
        if: runner.os == 'Linux'
        run: |
          # Taşınabilir tar.gz paketi
          mkdir -p evren-linux-pkg
          cp dist/evren evren-linux-pkg/
          cp evren.desktop evren-linux-pkg/
          cp evren_agent/ui/assets/icon.png evren-linux-pkg/
          chmod +x evren-linux-pkg/evren
          tar -czvf ${{ matrix.artifact_name }} -C evren-linux-pkg .

          # Debian/Ubuntu için .deb paketi
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.2.0"

          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/usr/bin
          mkdir -p deb_root/usr/share/applications
          mkdir -p deb_root/usr/share/icons/hicolor/256x256/apps

          cp dist/evren deb_root/usr/bin/evren
          chmod 755 deb_root/usr/bin/evren
          cp evren.desktop deb_root/usr/share/applications/
          cp evren_agent/ui/assets/icon.png deb_root/usr/share/icons/hicolor/256x256/apps/evren.png

          cat << EOF > deb_root/DEBIAN/control
          Package: evren
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: EVREN
          Description: EVREN LLM API Desktop Application
           Modern cross-platform desktop client for EVREN LLM APIs, OCR, and speech transcription.
          EOF

          dpkg-deb --build deb_root "evren_${VERSION}_amd64.deb"

      - name: Oluşturulan Paketi Yükle (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.artifact_name }}
            *.deb
          if-no-files-found: error

  # 2. Python Wheel ve Kaynak Paketi (.whl & .tar.gz)
  build-python-packages:
    name: Python Paketleri (sdist & wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodunu İndir
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build aracını yükle ve paketle
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Python Paketlerini Yükle
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  # 3. GitHub Sürümünü Oluştur ve Dosyaları Yayınla
  publish-release:
    name: GitHub Release Yayınla
    needs: [build-desktop, build-python-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodunu İndir
        uses: actions/checkout@v4

      - name: Tüm Paketleri İndir
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: SHA256 Doğrulama Özetlerini Oluştur
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          cd ..

      - name: Sürüm Etiketini Belirle
        id: get_tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Release Oluştur ve Dosyaları Ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "evren ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
