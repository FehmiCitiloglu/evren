name: CI - Sürekli Entegrasyon ve Testler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} Kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Linux Bağımlılıkları (Tkinter & SecretService)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 libsecret-1-dev

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Pytest ile Testleri Çalıştır
        run: |
          pytest
